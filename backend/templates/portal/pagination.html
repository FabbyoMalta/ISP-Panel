{% if objects.has_other_pages %}<nav class="pagination" aria-label="Páginas">{% if objects.has_previous %}<a class="button" href="?page={{ objects.previous_page_number }}&amp;metric={{ selected_metric|urlencode }}">← Anterior</a>{% endif %}<span>{{ objects.number }} / {{ objects.paginator.num_pages }}</span>{% if objects.has_next %}<a class="button" href="?page={{ objects.next_page_number }}&amp;metric={{ selected_metric|urlencode }}">Próxima →</a>{% endif %}</nav>{% endif %}

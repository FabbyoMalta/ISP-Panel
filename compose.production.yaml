# Requires Docker Compose >= 2.24.4 for !override.
services:
  migrate:
    environment:
      DEBUG: "false"
  web:
    environment:
      DEBUG: "false"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host':os.environ['ALLOWED_HOSTS'].split(',')[0], 'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r)"]
  proxy:
    environment:
      CADDY_SITE: ${DOMAIN:?Defina DOMAIN para HTTPS}
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
